<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<style>:root{--bg:#140F0C;--kart:#241A16;--yazi:#ECE9E2;--soluk:#B8AFA3;--vurgu:#D5C89E}
body{margin:0;background:var(--bg);color:var(--yazi);font:16px/1.65 -apple-system,Segoe UI,Inter,sans-serif}
main{max-width:720px;margin:0 auto;padding:56px 16px}a{color:var(--vurgu)}h1{font-size:28px;margin:0 0 4px}h2{font-size:18px;margin:32px 0 8px;color:var(--vurgu)}
p,li{color:var(--soluk)}.ust{color:var(--soluk);font-size:14px;margin-bottom:32px}code{background:var(--kart);padding:2px 6px;border-radius:6px;color:var(--yazi);word-break:break-all}</style><title>Connected — BKVerse Publisher</title></head><body><main>
<h1>Account connection</h1><div class="ust">BKVerse Publisher</div>
<p id="d">Reading the response…</p><p>Return to BKVerse Publisher. This page does not store anything.</p>
<p><code id="k">—</code></p>
<script>const q=new URLSearchParams(location.search);const c=q.get('code'),s=q.get('state'),e=q.get('error');
document.getElementById('d').textContent=c?'Connection approved.':(e?'Connection was not approved: '+e:'No code found.');
if(c)document.getElementById('k').textContent=JSON.stringify({code:c,state:s});
if(c){document.getElementById('d').textContent='Connection approved. Finishing on your computer…';setTimeout(()=>{location.href='http://127.0.0.1:8724/callback'+location.search},400);}</script></main></body></html>
